# QLTY-01 / INFRA-04: atualização automática de dependências e imagens.
version: 2
updates:
  # Dependências npm do monorepo (raiz cobre o workspace pnpm).
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      dev-dependencies:
        dependency-type: development

  # GitHub Actions usadas no CI.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly

  # Imagens base dos Dockerfiles (inclui bump do Playwright — INFRA-04).
  - package-ecosystem: docker
    directory: "/apps/api"
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: "/apps/web"
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: "/apps/scraper"
    schedule:
      interval: weekly
