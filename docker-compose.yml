services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: orbixlead
      POSTGRES_PASSWORD: orbixlead
      POSTGRES_DB: orbixlead
    ports:
      # INFRA-02: expõe apenas no localhost do host (dev). Nunca 0.0.0.0 em servidor.
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orbixlead"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      # INFRA-02: expõe apenas no localhost do host (dev). Redis sem senha (rede interna).
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file: .env
    environment:
      # docker-compose = ambiente de DEV. Sobrescreve o NODE_ENV=production da imagem
      # para não acionar a validação estrita de segredos (SEC-02) com credenciais de dev.
      NODE_ENV: development
      DATABASE_URL: postgresql://orbixlead:orbixlead@postgres:5432/orbixlead?schema=public
      REDIS_URL: redis://redis:6379
      API_PORT: 4000
      WEB_ORIGIN: http://localhost:3000
    ports:
      - "127.0.0.1:4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      API_INTERNAL_URL: http://api:4000
    ports:
      - "3000:3000"
    depends_on:
      - api

  scraper:
    build:
      context: .
      dockerfile: apps/scraper/Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgresql://orbixlead:orbixlead@postgres:5432/orbixlead?schema=public
      REDIS_URL: redis://redis:6379
      API_URL: http://api:4000
      SCRAPER_MODE: mock
      INTERNAL_API_KEY: orbixlead-internal-dev-key
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_started

volumes:
  postgres_data:
