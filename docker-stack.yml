# Stack Swarm de produção — Postgres e Traefik externos; Redis dedicado nesta stack.
# Rede pública: overlay externa network_public (Traefik, Postgres)
# Rede interna: orbixlead_internal (só api/scraper ↔ redis do Orbixlead)
# Imagens: automacaodebaixocusto/orbixlead:{web,api,scraper}
#
# SEGREDOS (CONF-01): NÃO coloque segredos em texto puro aqui. Use Docker Secrets.
# A aplicação lê segredos via padrão *_FILE (ex.: SESSION_SECRET_FILE=/run/secrets/session_secret).
#
# Crie os segredos ANTES do deploy (exemplos):
#   printf '%s' "$(openssl rand -hex 32)" | docker secret create orbixlead_session_secret -
#   printf '%s' "$(openssl rand -hex 32)" | docker secret create orbixlead_internal_api_key -
#   printf '%s' "postgresql://orbixlead:SENHA_FORTE@postgres:5432/orbixlead?schema=public" | docker secret create orbixlead_database_url -
#   printf '%s' "SENHA_SMTP_BREVO"      | docker secret create orbixlead_smtp_pass -        # opcional
#   printf '%s' "SENHA_SUPER_ADMIN"     | docker secret create orbixlead_super_admin_password - # opcional
#
# A API falha o boot (SEC-02) se SESSION_SECRET/INTERNAL_API_KEY estiverem ausentes,
# curtos (<32/<16) ou usando placeholder.
# API e scraper DEVEM usar o mesmo REDIS_URL (redis://redis:6379 = Redis desta stack).
#
#   docker stack deploy -c docker-stack.yml orbixlead

version: "3.8"

services:
  redis:
    image: redis:7-alpine
    networks:
      - orbixlead_internal
    command:
      [
        "redis-server",
        "--appendonly",
        "yes",
        "--save",
        "60",
        "1000",
        "--maxmemory-policy",
        "noeviction",
      ]
    volumes:
      - orbixlead_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 5s
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 64M

  web:
    image: automacaodebaixocusto/orbixlead:web
    networks:
      - network_public
    environment:
      NODE_ENV: production
      API_INTERNAL_URL: http://api:4000
    deploy:
      replicas: 1
      update_config:
        parallelism: 1
        delay: 10s
      restart_policy:
        condition: on-failure
      labels:
        - traefik.enable=true
        - traefik.docker.network=network_public
        - traefik.http.routers.orbixlead.rule=Host(`orbixlead.automacaodebaixocusto.com.br`)
        - traefik.http.routers.orbixlead.entrypoints=websecure
        - traefik.http.routers.orbixlead.tls=true
        - traefik.http.routers.orbixlead.tls.certresolver=letsencryptresolver
        - traefik.http.routers.orbixlead.priority=1
        - traefik.http.services.orbixlead-service.loadbalancer.server.port=3000
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3000/login').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 30s

  api:
    image: automacaodebaixocusto/orbixlead:api
    networks:
      - network_public
      - orbixlead_internal
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      NODE_ENV: production
      API_PORT: "4000"
      # Segredos via Docker Secrets (padrão *_FILE) — ver bloco `secrets:` no fim do arquivo.
      DATABASE_URL_FILE: /run/secrets/orbixlead_database_url
      SESSION_SECRET_FILE: /run/secrets/orbixlead_session_secret
      INTERNAL_API_KEY_FILE: /run/secrets/orbixlead_internal_api_key
      # Redis dedicado desta stack (rede orbixlead_internal) — NÃO o redis compartilhado da VPS.
      REDIS_URL: redis://redis:6379
      BULLMQ_PREFIX: orbixlead
      WEB_ORIGIN: https://orbixlead.automacaodebaixocusto.com.br
      COOKIE_SECURE: "true"
      # Opcional: crie o super admin na primeira subida via secret; senão use /setup.
      # SUPER_ADMIN_EMAIL: admin@suaempresa.com
      # SUPER_ADMIN_PASSWORD_FILE: /run/secrets/orbixlead_super_admin_password
      SUPER_ADMIN_NAME: Super Admin
      SMTP_HOST: smtp-relay.brevo.com
      SMTP_PORT: "587"
      SMTP_USER: ""
      # SMTP_PASS_FILE: /run/secrets/orbixlead_smtp_pass
      SMTP_FROM: Orbixlead <noreply@automacaodebaixocusto.com.br>
    secrets:
      - orbixlead_database_url
      - orbixlead_session_secret
      - orbixlead_internal_api_key
      # - orbixlead_smtp_pass
      # - orbixlead_super_admin_password
    deploy:
      replicas: 1
      update_config:
        parallelism: 1
        delay: 10s
      restart_policy:
        condition: on-failure
      labels:
        - traefik.enable=true
        - traefik.docker.network=network_public
        - traefik.http.routers.orbixlead-api.rule=Host(`orbixlead.automacaodebaixocusto.com.br`) && PathPrefix(`/api`)
        - traefik.http.routers.orbixlead-api.entrypoints=websecure
        - traefik.http.routers.orbixlead-api.tls=true
        - traefik.http.routers.orbixlead-api.tls.certresolver=letsencryptresolver
        - traefik.http.routers.orbixlead-api.priority=100
        - traefik.http.services.orbixlead-api-service.loadbalancer.server.port=4000
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:4000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s

  scraper:
    image: automacaodebaixocusto/orbixlead:scraper
    networks:
      - network_public
      - orbixlead_internal
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      NODE_ENV: production
      DATABASE_URL_FILE: /run/secrets/orbixlead_database_url
      # Redis dedicado desta stack (mesmo host DNS "redis" na rede interna).
      REDIS_URL: redis://redis:6379
      BULLMQ_PREFIX: orbixlead
      # Use o DNS interno do Swarm, não o domínio público (Traefik/sessão).
      API_URL: http://api:4000
      SCRAPER_MODE: playwright
      INTERNAL_API_KEY_FILE: /run/secrets/orbixlead_internal_api_key
      # Watchdog: se há jobs na fila e o worker fica mudo, exit(1) → restart.
      SCRAPER_STUCK_IDLE_MS: "90000"
      SCRAPER_WATCHDOG_MS: "30000"
    secrets:
      - orbixlead_database_url
      - orbixlead_internal_api_key
    # Evita 2 scrapers no mesmo Redis: Playwright pode ignorar SIGTERM até fechar o browser.
    stop_grace_period: 30s
    deploy:
      replicas: 1
      update_config:
        parallelism: 1
        delay: 10s
        # Padrão Swarm é start-first → container novo sobe ANTES do antigo cair = 2 workers.
        order: stop-first
        failure_action: rollback
      # on-failure: o watchdog mata o processo com exit 1 quando a fila trava.
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 0
        window: 120s
      resources:
        limits:
          # Playwright/Chromium: sem limite baixo demais (OOM freeze sem kill limpo).
          memory: 2G
        reservations:
          memory: 512M

networks:
  network_public:
    external: true
  # Só api/scraper/redis do Orbixlead — não compartilha com Wavro/multi-link/etc.
  orbixlead_internal:
    driver: overlay
    attachable: false

volumes:
  orbixlead_redis_data:

# CONF-01: segredos externos — crie com `docker secret create` antes do deploy (ver topo do arquivo).
secrets:
  orbixlead_database_url:
    external: true
  orbixlead_session_secret:
    external: true
  orbixlead_internal_api_key:
    external: true
  # orbixlead_smtp_pass:
  #   external: true
  # orbixlead_super_admin_password:
  #   external: true
